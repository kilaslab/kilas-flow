name: CI

# Every check a change must pass, in one file.
#
#   lint            go vet, gofmt, svelte-check, and the web vitest suite
#   test            go test ./... -race, against real PostgreSQL, MySQL and MariaDB
#   drift           the committed API client, SDK types, docs reference, and config reference still match the binary
#   sdk             the host SDK typechecks, tests, compiles, and packs into a tarball a consumer can install
#   smoke           the binary, the Vite proxy and the distroless image all serve
#   smoke-postgres  the image against a Compose PostgreSQL (not on pull requests)
#   e2e             Playwright against a real binary and SPA, one isolated instance per test
#   image           the image still cross-builds for every published architecture
#   docs            the documentation site builds and its internal links resolve
#   docs-publish    that site to GitHub Pages (main only, and opt-in — see below)
#
# Every job runs Make targets rather than its own copy of the commands, so a
# laptop and a runner check the same thing and cannot drift apart. Add a check
# to the Makefile first and call it here second.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push mid-review makes the superseded run's verdict worthless, so cancel
# it. Pushes to main are not cancelled: the default branch keeps every result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here publishes, comments or tags. Read-only is all it needs, and the
# p10 tickets that do publish should widen this per job rather than at the top.
# Publishing the image lives in release.yml, which does exactly that; the image
# job below builds and pushes nothing, so it stays inside this default.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod carries the toolchain version already; setup-go reads it so CI
      # cannot end up on a different Go than the module declares.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/js-toolchain

      # `make lint` finishes with svelte-check and vitest in web/, so this job
      # needs the frontend dependencies despite reading like a Go-only check.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - run: make lint

      # Pure grep over a file list, no toolchain: every published coordinate
      # (image, source label, docs, SDK metadata) must name the repository's real
      # owner. See scripts/check-coordinates.sh.
      - name: Published coordinates
        run: make coordinates-check

      # The workspace must survive a build unchanged. A build that rewrites a
      # tracked file makes the tree dirty before `git describe --dirty` runs, so
      # every binary, image and /health response is stamped "-dirty" from a clean
      # checkout — and a fresh clone ships build output that references files it
      # does not have. Runs build-all, which is why this job installs web's
      # dependencies above.
      - name: Build leaves the tree clean
        run: make build-clean-check

  test:
    name: Go tests
    runs-on: ubuntu-latest

    # internal/database, internal/sqlbuild, internal/loadoptions and
    # nodes/database_test.go all gate their integration coverage behind a DSN and
    # t.Skip without one. A skip is indistinguishable from a pass in a summarised
    # run, so leaving these unset would have CI reporting green over the only
    # tests that touch a real engine. Three containers cost about a minute of
    # startup that overlaps checkout; that is cheap next to the coverage.
    #
    # MariaDB is a third service rather than an alias for MySQL because the two
    # differ on exactly the two decisions the SQL builder makes for them: MariaDB
    # has INSERT … RETURNING and lacks MySQL 8.0.19's row-alias upsert, so a
    # change exercised against only one of them can be wrong on the other and
    # still pass. Credentials mirror .pine/memory/live-databases.md so a failure
    # here reproduces by hand with the commands already written down there.
    services:
      # pgvector rather than stock PostgreSQL: migration 000006 creates a
      # vector column and runs CREATE EXTENSION vector, so against postgres:17
      # every PostgreSQL-gated package fails at migration time — which is a red
      # check for a build that is fine. compose.postgres.yaml pins the same
      # image for the same reason.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kilas
          POSTGRES_PASSWORD: hunter2
          POSTGRES_DB: kilasflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kilas -d kilasflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: hunter2
          MYSQL_DATABASE: kilasflow
          MYSQL_USER: kilas
          MYSQL_PASSWORD: hunter2
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ukilas -phunter2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: hunter2
          MARIADB_DATABASE: kilasflow
          MARIADB_USER: kilas
          MARIADB_PASSWORD: hunter2
        # 3307 on the host because the MySQL service already holds 3306 there.
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -ukilas -phunter2"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # CGO stays enabled here. A devbox shell exports CGO_ENABLED=0 for the
      # distroless build, and copying that setting into this job would break
      # `-race`, which needs cgo.
      # `make test` turns package parallelism off when a PostgreSQL DSN is set:
      # these packages share the one database, and internal/database's migration
      # tests drop every table. See the comment on the test target in the
      # Makefile.
      #
      # Node 24 comes from the js-toolchain composite, which pins the version in
      # devbox.json: the sidecar's real-Node tests run `node` from PATH, and
      # ubuntu-latest's default Node may predate the stable --permission flag
      # they depend on. KILASFLOW_TEST_REQUIRE_NODE turns their "no Node"
      # skip into a failure, so a missing Node is a red check rather than a
      # green run that skipped every sidecar test.
      - uses: ./.github/actions/js-toolchain

      - name: Go tests
        env:
          KILASFLOW_TEST_POSTGRES_DSN: postgres://kilas:hunter2@127.0.0.1:5432/kilasflow?sslmode=disable
          KILASFLOW_TEST_MYSQL_DSN: mysql://kilas:hunter2@127.0.0.1:3306/kilasflow
          KILASFLOW_TEST_MARIADB_DSN: mysql://kilas:hunter2@127.0.0.1:3307/kilasflow
          KILASFLOW_TEST_REQUIRE_NODE: "1"
        run: make test

      # This step exists to say out loud that the corpus baseline is NOT
      # verified here, rather than letting a skip pass for a check.
      #
      # BASELINE.md scores 39 fixtures. Two are committed; the rest are
      # third-party n8n and WAHA workflows that .gitignore deliberately keeps out
      # of the repository, because they are LicenseRef-n8n-sustainable-use or
      # carry no licence at all. Materialising them needs a local n8n reference
      # checkout, which .pine/memory/licensing.md forbids as a build input of any
      # kind. So CI scores the committed control fixtures — which must reach
      # every tier — and prints TestCorpusScoreboard's skip line naming the sync
      # command. Regenerating and comparing the baseline stays a
      # `make corpus-baseline` run by hand, recorded on the ticket that moves the
      # numbers. Do not "fix" this by fetching the corpus in CI.
      - name: n8n corpus (control fixtures only; baseline not verifiable in CI)
        run: make corpus-check

  drift:
    name: Generated client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/js-toolchain

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install SDK dependencies
        working-directory: sdk
        run: pnpm install --frozen-lockfile

      # Both detectors build a KilasFlow binary and read its OpenAPI document,
      # which is why this job needs Go and Node together. No binary is taken from
      # another job on purpose: the detectors are only worth anything because the
      # spec comes from a server built and booted right here, and consuming a
      # shared artifact would reintroduce the checked-in copy they exist to
      # eliminate. Each prints its own "…is stale" message on failure, naming the
      # generate command to run.
      #
      # `if: always()` on all four: they are independent, and stopping at the
      # first one hid the other stale artifacts — a run that regenerated only the
      # client it was told about left the next one to fail on someone else's
      # afternoon. A failed step still fails the job.
      - name: Web API client
        if: always()
        run: make generate-api-check

      - name: SDK types
        if: always()
        run: make generate-types-check

      # The docs API reference is generated from the same live OpenAPI
      # document by scripts/generate-api-reference.mjs, which builds and boots
      # a binary with the Go toolchain this job already has. Node-only like
      # the script: no docs dependencies to install.
      - name: Docs API reference
        if: always()
        run: make generate-api-reference-check

      # The configuration reference and config.example.yaml are generated from
      # the Config structs by scripts/config-reference.go, which reads source
      # and defaults only — no binary, no Node, so this step needs just Go.
      - name: Configuration reference
        if: always()
        run: make generate-config-reference-check

  sdk:
    name: Host SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go is needed here after all: operation-coverage.test.mjs reaches
      # `go build ./cmd/kilasflow` through scripts/dump-openapi.mjs, which only
      # appeared to pass before because the runner ships a Go toolchain. Pin the
      # same action the other jobs use so the version comes from go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/js-toolchain

      - name: Install SDK dependencies
        working-directory: sdk
        run: pnpm install --frozen-lockfile

      # `generate-types-check` needs a binary built from this tree too, and it
      # still lives in the drift job, with the Go toolchain that job already
      # has.
      - run: make sdk-check
      - run: make sdk-test
      - run: make sdk-build
      # Manifest-versus-source agreement for SDK_VERSION and the Apache-2.0
      # licence: pure file reads, no Go and no binary, so it lives here rather
      # than in the drift job.
      - run: make sdk-version-check
      # Packs the tarball and checks it the way a consumer receives it:
      # install into a scratch project, typecheck under bundler, node16 and
      # nodenext, import all three subpaths. `sdk-check` cannot see a missing
      # `.js` extension in a relative re-export; this is the gate that can.
      - run: make sdk-package-check
      # Runs examples/host-page the way a consumer does: the packed SDK
      # installed into a copy outside the repository, against a stub
      # KilasFlow, with raw `..%2f` probes at the example's static route.
      - run: make sdk-example-check

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/js-toolchain

      # smoke-sqlite runs `make build-all`, which builds the real SPA, and
      # smoke-dev starts the Vite dev server. Both need the frontend installed.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Boots a real binary against a fresh SQLite database and asserts
      # /api/v1/health, /api/openapi.json and the SPA history fallback.
      - run: make smoke-sqlite

      # Proves the Vite proxy, which no unit test can reach: a broken proxy
      # config breaks every contributor's `make dev` and nothing else catches it.
      - run: make smoke-dev

      # Last because it builds the image from scratch. Proves the distroless,
      # non-root image serves and can write to a bind mount.
      - run: make smoke-docker

  smoke-postgres:
    name: Smoke (PostgreSQL)
    runs-on: ubuntu-latest

    # Deliberately not on pull requests. It builds the image, brings up
    # postgres:17-alpine under Compose, runs TestMigratePostgres against it in a
    # second container and tears down with `down -v` — by a wide margin the
    # slowest check here. A check that makes every review wait is a check
    # somebody eventually disables, so it runs on the default branch and on
    # demand. The migration path it covers is not left to this job alone: the
    # test job runs the same PostgreSQL coverage against a service container on
    # every pull request.
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make smoke-postgres

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    # The suite is environment-gated: PostgreSQL, the WAHA corpus, a local model
    # and a live n8n each make their specs skip when absent, and a skip reads as
    # a pass in a summarised run. What this job can provide, it does — the
    # database service below turns the PostgreSQL half of the epic acceptance
    # suite from skipped into run. What it cannot provide (the corpus is
    # third-party material with no licence, a model is not on a runner, and n8n
    # credentials are not in the repository) stays skipped, and the skip-budget
    # step at the end of this job is what keeps that visible: every skip must
    # name a reason on the allowlist and the total may not grow.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kilas
          POSTGRES_PASSWORD: hunter2
          POSTGRES_DB: kilasflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kilas -d kilasflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/js-toolchain

      # The suite boots a real binary with the real SPA embedded, so this job
      # needs the frontend installed: global-setup runs `make build-all`.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      # Proof 4 installs the SDK the operator's way — `npm pack sdk`, whose
      # prepack runs `tsc -p tsconfig.build.json`. Without the SDK's own
      # dependencies that fails with "tsc: command not found" and the
      # external-consumer proof is red for a reason that has nothing to do with
      # the code under test.
      - name: Install SDK dependencies
        working-directory: sdk
        run: pnpm install --frozen-lockfile

      # Needs --with-deps: the runner has no browser libraries until apt
      # installs them, and headless Chromium does not run without them.
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      # Builds once in global-setup, then boots one isolated instance per
      # test — the same command a laptop runs. global-setup writes only
      # gitignored output, so running the suite no longer leaves the checkout
      # modified (see the build-clean-check step in the lint job).
      - run: make test-e2e
        env:
          # Both names are read by the datastore fixture; the e2e one keeps a
          # throwaway database from disturbing a developer's Go test runs.
          KILASFLOW_E2E_POSTGRES_DSN: postgres://kilas:hunter2@127.0.0.1:5432/kilasflow?sslmode=disable

      # A skipped test is not a passing test, and the summary counts them as
      # neither. This step reads the JSON report the run wrote and refuses a
      # skip whose reason is not on the allowlist in e2e/skip-budget.json, or a
      # total that grew past the recorded one.
      - name: Skip budget
        if: always()
        run: make e2e-skip-budget

  image:
    name: Image (cross-build)
    runs-on: ubuntu-latest

    # The smoke job already builds the image, but only for the runner's amd64.
    # Without this job the linux/arm64 half of every published manifest list is
    # first built while cutting a release, which is the worst moment to learn that
    # a Dockerfile change broke cross-compilation. Cheap to run because nothing is
    # emulated: the Go stage is pinned to the build platform and cross-compiles,
    # and the runtime stage executes nothing at all.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner's default docker driver cannot produce a manifest list, so a
      # multi-platform build needs a container builder even when, as here, the
      # result is discarded rather than exported.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The same target release.yml builds from, minus the push. A break here is a
      # break in the release path.
      - run: make docker-multiarch

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Go. docs/ is a third pnpm project alongside web/ and sdk/ and never
      # touches the binary — nothing it produces is copied into
      # internal/web/dist or reached by a go:embed directive.
      - uses: ./.github/actions/js-toolchain

      - name: Install documentation dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # `make docs-build` runs the Astro build, which is also where internal
      # links are validated — the validator does not run under `astro dev`. So a
      # page renamed without updating the links into it fails here, in the same
      # way a syntax error would, rather than reaching a reader as a 404.
      # Built with no DOCS_BASE, which is how a contributor builds it locally.
      - run: make docs-build

  docs-publish:
    name: Publish documentation
    needs: docs
    runs-on: ubuntu-latest

    # Opt-in, and deliberately so. Publishing needs GitHub Pages switched on for
    # the repository with its source set to GitHub Actions, and that is a
    # settings change no workflow can make for itself: configure-pages can
    # enable Pages, but only when handed a token with administration rights,
    # which GITHUB_TOKEN is not. Running unconditionally would therefore leave
    # the default branch permanently red on a step nobody could fix from a
    # commit, and a red main is worse than an unpublished site — it trains
    # everyone to ignore the pipeline.
    #
    # To turn publishing on, once:
    #   1. Settings → Pages → Source: GitHub Actions.
    #   2. Settings → Secrets and variables → Actions → Variables:
    #      DOCS_PUBLISH = true
    #
    # Until step 2 this job is skipped, which reads as "not switched on" rather
    # than as a failure.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PUBLISH == 'true'

    # Widened here rather than at the top of the file, so that the six jobs which
    # only read stay read-only. This is the only job that writes anything.
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    # One deployment at a time, and never cancelled halfway: interrupting a
    # deploy can leave the site partially replaced.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/js-toolchain

      - name: Install documentation dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # Where the deployment URL comes from. A project Pages site is served from
      # /<repo>/, and this reports that path for the repository actually being
      # published rather than having it written into astro.config.mjs, where it
      # would be a guess — the git remote says `k-flow` while go.mod and the
      # README say `kilas-flow`, and picking the wrong one produces a site whose
      # every stylesheet 404s.
      - name: Resolve the Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # A second build, not a wasted one. The docs job above builds at the root,
      # the way a contributor does; this builds at the subpath the site is
      # actually served from. The link validator runs in both, and the two are
      # genuinely different checks — a link that resolves at the root can still
      # be broken under a base.
      - name: Build the site for its published URL
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: make docs-build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
