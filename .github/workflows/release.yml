name: Release

# Publishing, for the two namespaces of version tag.
#
# Push a tag and this runs; nothing else publishes anything, and pushing a tag is
# the only way to publish. This file publishes two artefacts:
#
#   v*      the container image, via scripts/docker-tags.sh and `make docker-release`
#   sdk-v*  the @kilasflow/sdk package, via the sdk job below
#
# The tag is the input: `make docker-release` is handed `VERSION=<the tag>`,
# scripts/docker-tags.sh turns it into the three published tags, and the
# Dockerfile stamps it into main.version — which is also what the `-version` flag
# prints and what the OpenAPI document reports as info.version.
#
# The SDK release procedure, including the one-time owner setup and the steps
# that flip the "not published yet" claims afterwards, is sdk/RELEASING.md.
#
# The image tag vocabulary, and which one to pin, is documented at the top of
# scripts/docker-tags.sh. Short version: pin the exact `vX.Y.Z` tag in production,
# because the other two move underneath you.
#
# Like ci.yml, every job here calls a Make target rather than its own copy of the
# commands, so that a release can be reproduced from a laptop. The one thing that
# cannot be reproduced by hand is the signature — keyless cosign needs an OIDC
# token that only a workflow run has — and that is why signing is its own target.

on:
  push:
    # `v*` releases the container image; `sdk-v*` releases the host SDK. The
    # namespaces are disjoint — `v*` cannot match `sdk-v0.1.0` — so each tag
    # releases exactly one artifact, and the jobs below gate on their own
    # namespace (`v*` for the image, `sdk-v*` for the SDK).
    tags: ["v*", "sdk-v*"]

# Wider than ci.yml's read-only default, per job rather than at the top, exactly
# as ci.yml's header asks the p10 publishing tickets to do.
permissions:
  contents: read

jobs:
  image:
    name: Publish image
    # Only a v* tag publishes the image. Without this, an sdk-v* tag — the SDK
    # release trigger — started this job too: its scripts/docker-tags.sh rejects
    # the tag, but that failure sits inside a `$(...)` argument in the
    # docker-release recipe, so the only thing that stopped the push was buildx
    # refusing an untagged image. A job holding packages:write and id-token:write
    # must not run on a tag that is not its own.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Push to GitHub Container Registry under the kilaslab namespace (the
      # repository's owner; `IMAGE` in the Makefile carries the same name). GHCR was
      # chosen over Docker Hub because the repository and this runner are already
      # on GitHub, so it needs no credential beyond the token below.
      packages: write
      # Keyless cosign signing exchanges this token for a short-lived certificate.
      # Without it the signing step cannot work at all.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A container builder rather than the runner's default docker driver: only
      # the former can emit a manifest list, which is the entire point of this
      # workflow. No QEMU is set up alongside it on purpose — the Dockerfile
      # cross-compiles and never executes anything for the target architecture, so
      # an emulator would be dead weight. If a RUN ever appears in the runtime
      # stage, this is where the resulting failure will surface.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.ref_name is the tag, and passing it explicitly rather than letting
      # the Makefile call `git describe` removes the one way a release could be
      # stamped with a hash: describe on a shallow or tag-less checkout silently
      # falls back to a commit hash, and this must fail loudly instead.
      #
      # It reaches the shell through env rather than through `${{ }}` interpolated
      # into the run line, because a git tag may legally contain shell
      # metacharacters and the interpolated form would execute them. Whoever can
      # push a tag here can already do worse, but a step holding packages:write and
      # id-token:write is not the place to rely on that.
      - name: Build and push
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: make docker-release VERSION="$RELEASE_VERSION"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Nothing verifies these signatures yet. They are produced now because
      # signing from the first release is cheap, whereas starting to sign after
      # consumers already trust unsigned images means asking every one of them to
      # change what they check.
      - name: Sign
        run: make docker-sign

      # The published artifact, proved by pulling it rather than by trusting the
      # build that just ran. This is the only step that exercises the manifest
      # list: the runner is amd64, so it proves that half resolves and runs. The
      # arm64 half is not proved here — see the ticket.
      - name: Smoke the published image
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: make smoke-docker-published VERSION="$RELEASE_VERSION"

  sdk:
    name: Publish SDK
    # Only an sdk-v* tag publishes the package. Anything else — a branch, a
    # v* image tag, a hand-run — reaches at most the gates, never the registry.
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # npm provenance attests the package back to this workflow run. Like
      # keyless cosign above, the attestation needs the OIDC token only a
      # workflow run has, which is why a publish cannot be reproduced by hand.
      id-token: write

    steps:
      # No credentials left behind: the publish below authenticates with the
      # OIDC token and (only until the trusted publisher exists) a step-scoped
      # secret, never with what checkout leaves in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK tests and `generate-types-check` build ./cmd/kilasflow through
      # scripts/dump-openapi.mjs, so a Go binary must be present rather than
      # assumed from the runner's image. Pinned as in ci.yml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # `cache: ''` disables the pnpm store cache for a release build: using a
      # cache written by CI is the one input here that is not the tagged tree,
      # and a release does not need the speed. ci.yml keeps the default.
      - uses: ./.github/actions/js-toolchain
        with:
          cache: ''

      - name: Install SDK dependencies
        working-directory: sdk
        run: pnpm install --frozen-lockfile

      # Trusted publishing is npm 11.5.1 or later; fail before the build rather
      # than after it, when the failure would be an unexplained OIDC error.
      - run: node sdk/scripts/release.mjs npm-version

      # Everything that can be checked without a registry, in one step: the tag
      # parses, the tag, the manifest and src/version.ts agree, the changelog
      # entry is labelled, the manifest coordinates are right and sdk/LICENSE
      # matches the repository's. Its stdout is written to $GITHUB_OUTPUT, so
      # `dist_tag` below comes from the same place the version was checked. The
      # tag reaches it through env, never interpolated into the run line: a git
      # tag may legally contain shell metacharacters.
      - name: Release facts
        id: release
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: node sdk/scripts/release.mjs facts "$SDK_TAG" >> "$GITHUB_OUTPUT"

      # The same gates a laptop runs, in the same order, one step per target of
      # `make sdk-release-check` — release-workflow.test.mjs asserts this list
      # equals that recipe, so the pipeline and the laptop command cannot drift.
      - run: make sdk-check
      - run: make sdk-test
      - run: make sdk-build
      - run: make sdk-version-check
      - run: make generate-types-check
      - run: make sdk-package-check
      - run: make sdk-example-check

      # With the trusted publisher configured, the OIDC token above is the only
      # credential, exchanged by npm for a short-lived grant, and the NPM_TOKEN
      # branch below is dead. It exists only because a trusted publisher cannot
      # be configured before the package exists (`npm help trust`: "Package must
      # exist"), so the first release needs a bootstrap credential. See
      # sdk/RELEASING.md, "One-time owner setup".
      #
      # BOOTSTRAP ONLY — delete this step's `env:` and the shell `if` below once
      # the trusted publisher is configured and the NPM_TOKEN secret is removed.
      - name: Publish @kilasflow/sdk
        working-directory: sdk
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            umask 077
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          fi
          npm publish --provenance --access public --tag "$DIST_TAG"
