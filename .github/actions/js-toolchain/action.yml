name: JS toolchain
description: Install the Node and pnpm versions this repository already pins.

# Four jobs need Node. Repeating the three steps below in each of them would
# mean four places to edit when an action is re-pinned, and four chances for
# them to disagree; this composite keeps the pinned SHAs in one file.
#
# `cache` is exposed so the release workflow can turn the pnpm store cache off
# for a publish: a cache is the one build input that is not the tagged tree, and
# a release does not need the speed. Everything else keeps the default.
inputs:
  cache:
    description: Passed to actions/setup-node's `cache`; '' disables caching.
    required: false
    default: pnpm

runs:
  using: composite
  steps:
    # devbox.json is the only place Node is pinned: there is no .nvmrc, no
    # .node-version and no `engines` field for setup-node to read. Parsing it
    # here keeps CI on the version a devbox shell gives a contributor instead
    # of stating a second version that can drift from it. The empty check is
    # deliberate — if the pin is renamed, this must fail loudly rather than
    # silently fall through to whatever Node the runner ships.
    - id: node-version
      shell: bash
      run: |
        version="$(sed -n 's/.*"nodejs@\([0-9][0-9.]*\)".*/\1/p' devbox.json)"
        if [ -z "$version" ]; then
          echo "no \"nodejs@<version>\" entry in devbox.json" >&2
          exit 1
        fi
        echo "version=$version" >>"$GITHUB_OUTPUT"

    # Before setup-node, because setup-node's pnpm cache asks pnpm where its
    # store lives and cannot do that until pnpm is on PATH.
    #
    # The version comes from web/package.json's `packageManager` field rather
    # than an input here, for the same reason as above: it is already pinned
    # (pnpm@10.15.0) and must not be written down twice. sdk/package.json pins
    # the identical version, so either would do.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: web/package.json

    # web/, sdk/ and docs/ are separate installs with separate lockfiles — there
    # is no pnpm workspace at the root — so all three lockfiles feed the cache
    # key. A lockfile left out here would not break a build, but it would let a
    # dependency change in that project restore a store that predates it.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.node-version.outputs.version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: |
          web/pnpm-lock.yaml
          sdk/pnpm-lock.yaml
          docs/pnpm-lock.yaml
