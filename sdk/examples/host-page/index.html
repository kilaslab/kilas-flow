<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>KilasFlow embedded editor</title>
	<style>
		body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; }
		header, footer { padding: 12px 16px; border-block: 1px solid #ddd; }
		#editor { min-height: 0; }
		#log { margin: 0; max-height: 8rem; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; }
	</style>
</head>
<body>
	<header><strong>Acme</strong> — customer onboarding flow</header>
	<div id="editor"></div>
	<footer><ul id="log"></ul></footer>

	<script type="module">
		import { mountWorkflowEditor, subscribeExecutionEvents } from '/node_modules/@kilasflow/sdk/dist/browser.js';

		const log = (message) => {
			const item = document.createElement('li');
			item.textContent = message;
			document.getElementById('log').prepend(item);
		};

		// The page holds no API key. It asks its own backend for a session.
		const session = await (await fetch('/api/embed-session', { method: 'POST' })).json();

		const editor = mountWorkflowEditor({
			container: document.getElementById('editor'),
			baseUrl: session.baseUrl,
			session,
			onError: (error) => log(`error: ${error.message}`),
			onEvent: (event) => {
				log(`editor: ${event.type}`);
				if (event.type === 'execution-started') {
					// Typed live events for the run the user just started.
					subscribeExecutionEvents({
						baseUrl: session.baseUrl,
						executionId: event.executionId,
						onEvent: (execution) => log(`  ${execution.type}${execution.nodeId ? ` (${execution.nodeId})` : ''}`),
						onClose: () => log('  stream closed')
					});
				}
			}
		});

		// Tearing the page down removes the iframe, its listener, and its timer.
		window.addEventListener('pagehide', () => editor.unmount());
	</script>
</body>
</html>
